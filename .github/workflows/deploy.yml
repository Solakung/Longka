name: Deploy Lanka Game

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Inject build version into files
        run: |
          SHORT_SHA=$(echo "$GITHUB_SHA" | cut -c1-7)
          echo "Building version: $SHORT_SHA"
          sed -i "s|__BUILD_SHA__|$SHORT_SHA|g" sw.js
          sed -i "s|__BUILD_VERSION__|$SHORT_SHA|g" index.html
          echo "=== sw.js line 1 ==="
          head -1 sw.js
          echo "=== index.html asset tags ==="
          grep -E "style\.css|game\.js" index.html | head -4

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
